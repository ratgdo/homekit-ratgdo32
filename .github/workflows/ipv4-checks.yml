name: IPv4 event checks

on:
  pull_request:
    paths:
      - src/homekit.cpp
      - lib/ratgdo/ipv4_config.h
      - tests/ipv4_config.cpp
      - platformio.ini
      - .github/workflows/ipv4-checks.yml
  push:
    paths:
      - src/homekit.cpp
      - lib/ratgdo/ipv4_config.h
      - tests/ipv4_config.cpp
      - platformio.ini
      - .github/workflows/ipv4-checks.yml

permissions:
  contents: read

concurrency:
  group: ipv4-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test IPv6-first startup and IPv4 renewal
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/ipv4_config.cpp -o /tmp/ipv4-test
          /tmp/ipv4-test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ratgdo_esp32dev, MJS_dev32]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run -e ${{ matrix.environment }}
